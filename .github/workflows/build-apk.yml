name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Sensei APK
    runs-on: ubuntu-latest

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Accept Android Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses 2>/dev/null || true

      - name: Build Android Debug APK
        run: |
          set -e
          # If files are in android/ directory, switch there
          if [ -d "android" ] && [ -f "android/build.gradle.kts" ]; then
            cd android
          fi

          echo "Working in: $(pwd)"
          
          # Use gradle to create wrapper or build directly
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew assembleDebug --no-daemon --stacktrace
          else
            gradle assembleDebug --no-daemon --stacktrace
          fi

      - name: Collect Output APK
        run: |
          mkdir -p release_apk
          find . -name "*debug.apk" -o -name "*.apk" | head -n 1 | xargs -I {} cp {} release_apk/Sensei.apk
          echo "Built APK located at:"
          ls -la release_apk/

      - name: Upload APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Sensei-APK
          path: release_apk/Sensei.apk
          retention-days: 30

      - name: Publish Direct APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.event_name == 'workflow_dispatch'
        with:
          tag_name: v1.0.0
          name: "Sensei Android APK v1.0.0"
          body: "🐊 Sensei BingeLingo Android Uygulaması. Doğrudan telefonunuza indirip kurabilirsiniz!"
          draft: false
          prerelease: false
          files: release_apk/Sensei.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
