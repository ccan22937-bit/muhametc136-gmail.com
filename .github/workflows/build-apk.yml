name: Build Sensei APK & AAB

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Real Sensei APK & Play Store AAB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Web Dependencies & Build Vite App
        run: |
          npm install --legacy-peer-deps --no-audit --no-fund
          npx vite build

      - name: Sync Web Bundle into Android Assets
        run: |
          rm -rf android/app/src/main/assets
          mkdir -p android/app/src/main/assets/dist
          python3 - <<'PY'
          import os, shutil
          src_root = 'dist'
          dst_root = 'android/app/src/main/assets/dist'
          skip_exts = ('.apk', '.cjs', '.map', '.zip', '.idsig')
          for root, dirs, files in os.walk(src_root):
              rel = os.path.relpath(root, src_root)
              # Exclude chat attachment screenshots/recordings & unused zips
              dirs[:] = [
                  d for d in dirs
                  if not (rel == 'assets' and d == 'aistudio')
              ]
              target_dir = dst_root if rel == '.' else os.path.join(dst_root, rel)
              os.makedirs(target_dir, exist_ok=True)
              for f in files:
                  if f.endswith(skip_exts) or 'Screenshot_' in f or 'Screenrecorder-' in f:
                      continue
                  shutil.copy2(os.path.join(root, f), os.path.join(target_dir, f))
          print("Synced android/app/src/main/assets/dist:")
          for item in sorted(os.listdir(dst_root)):
              print(" -", item)
          PY

      - name: Prepare Android Gradle Environment
        run: |
          rm -f android/local.properties
          chmod +x android/gradlew
          if [ -n "$ANDROID_HOME" ] && [ -d "$ANDROID_HOME/cmdline-tools" ]; then
            yes | "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager --licenses >/dev/null 2>&1 || true
          fi

      - name: Build Signed Release APK & Play Store AAB
        working-directory: android
        run: |
          ./gradlew assembleRelease bundleRelease --no-daemon --stacktrace

      - name: Verify Real Native LiteRT-LM Libraries & Web Bundle inside APK
        run: |
          APK_PATH="android/app/build/outputs/apk/release/app-release.apk"
          AAB_PATH="android/app/build/outputs/bundle/release/app-release.aab"
          test -f "$APK_PATH"
          test -f "$AAB_PATH"
          echo "Checking APK contents..."
          unzip -l "$APK_PATH" | grep "assets/dist/index\.html"
          unzip -l "$APK_PATH" | grep "\.so$"
          mkdir -p release_output
          cp "$APK_PATH" release_output/Sensei.apk
          cp "$AAB_PATH" release_output/Sensei.aab
          ls -lh release_output/

      - name: Upload APK & AAB as Workflow Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Sensei-Android-Builds
          path: |
            release_output/Sensei.apk
            release_output/Sensei.aab
          retention-days: 30

      - name: Publish APK & AAB to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: sensei-v3.1-b${{ github.run_number }}
          name: "Sensei Android v3.1 (Build #${{ github.run_number }})"
          body: |
            Sensei BingeLingo Gercek Android Derlemesi (LiteRT-LM 0.16.1 + ML Kit + Native TTS).
            - Telefonunuza kurmak icin: Sensei.apk
            - Google Play Store yuklemesi icin: Sensei.aab
          draft: false
          prerelease: false
          make_latest: true
          files: |
            release_output/Sensei.apk
            release_output/Sensei.aab
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
