name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Sensei APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Grant Execute Permissions
        run: |
          chmod +x ./gradlew 2>/dev/null || true
          chmod +x ./android/gradlew 2>/dev/null || true

      - name: Build Android APK
        run: |
          set -e
          if [ -d "android" ] && [ -f "android/gradlew" ]; then
            echo "Building from android/ directory..."
            cd android
            ./gradlew assembleDebug --no-daemon --stacktrace
          else
            echo "Building from root directory..."
            ./gradlew assembleDebug --no-daemon --stacktrace
          fi

      - name: Collect and Rename APK
        run: |
          mkdir -p release_apk
          find . -name "*.apk" -type f -exec cp {} release_apk/Sensei.apk \;
          echo "Generated APK:"
          ls -la release_apk/

      - name: Upload APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Sensei-APK
          path: release_apk/Sensei.apk
          retention-days: 30

      - name: Publish Direct APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.event_name == 'workflow_dispatch'
        with:
          tag_name: v1.0.0
          name: "Sensei Android APK v1.0.0"
          body: "🐊 Sensei BingeLingo Android Uygulaması. Doğrudan telefonunuza kurabilirsiniz!"
          draft: false
          prerelease: false
          files: release_apk/Sensei.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
