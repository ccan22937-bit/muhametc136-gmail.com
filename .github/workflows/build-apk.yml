name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Sensei APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle 8.4
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.4'

      - name: Build Android Debug APK
        run: |
          set -e
          # Go to android directory if project is in android/ subfolder
          if [ -d "android" ] && [ -f "android/build.gradle.kts" ]; then
            cd android
          fi

          echo "Current directory: $(pwd)"
          
          # Generate fresh gradle wrapper to prevent any missing jar errors
          gradle wrapper --gradle-version 8.4
          chmod +x ./gradlew || true

          # Build debug APK
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Collect and Prepare APK
        run: |
          mkdir -p release_apk
          find . -name "*.apk" -type f -exec cp {} release_apk/Sensei.apk \;
          echo "Found APK:"
          ls -la release_apk/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Sensei-APK
          path: release_apk/Sensei.apk
          retention-days: 30

      - name: Publish Direct APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.event_name == 'workflow_dispatch'
        with:
          tag_name: latest
          name: "Sensei Canlı APK v1.0.0"
          body: "🐊 Sensei BingeLingo Android Uygulaması. Doğrudan telefonunuza kurabilirsiniz!"
          draft: false
          prerelease: false
          files: release_apk/Sensei.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
