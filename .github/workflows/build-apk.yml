name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Sensei APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.4'

      - name: Build Android APK
        run: |
          set -e
          # If project files are inside android/ directory, navigate there
          if [ -d "android" ] && [ -f "android/build.gradle.kts" ]; then
            cd android
          fi
          
          echo "Starting Gradle Build in $(pwd)..."
          gradle wrapper --gradle-version 8.4
          chmod +x ./gradlew
          ./gradlew :app:assembleDebug --stacktrace --info

      - name: Collect Output APK
        run: |
          mkdir -p release_apk
          APK_PATH=$(find . -name "*debug.apk" -o -name "*.apk" | head -n 1)
          if [ -n "$APK_PATH" ]; then
            cp "$APK_PATH" release_apk/Sensei.apk
            echo "Successfully found APK: $APK_PATH"
          else
            echo "ERROR: APK could not be found!"
            exit 1
          fi

      - name: Upload APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Sensei-APK
          path: release_apk/Sensei.apk
          retention-days: 30

      - name: Publish Direct APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.event_name == 'workflow_dispatch'
        with:
          tag_name: v1.0.0
          name: "Sensei Android APK v1.0.0"
          body: "🐊 Sensei BingeLingo Android Uygulaması. Doğrudan telefonunuza indirip kurabilirsiniz!"
          draft: false
          prerelease: false
          files: release_apk/Sensei.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
