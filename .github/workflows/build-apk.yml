name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Sensei APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.4'

      - name: Prepare Keystore and Environment
        run: |
          if [ -f "debug.keystore.base64" ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          else
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi
          if [ ! -f ".env" ] && [ -f ".env.example" ]; then
            cp .env.example .env
          fi

      - name: Generate Wrapper and Build APK
        run: |
          echo "Building APK using system Gradle 8.4..."
          if [ -d "android/app" ]; then
            cd android
            gradle :app:assembleDebug --no-daemon --stacktrace || gradle assembleDebug --no-daemon --stacktrace
            cd ..
          else
            gradle :app:assembleDebug --no-daemon --stacktrace || gradle assembleDebug --no-daemon --stacktrace
          fi

      - name: Locate and Rename APK
        run: |
          mkdir -p release_apk
          find . -name "*debug.apk" -o -name "*.apk" | head -n 1 | xargs -I {} cp {} release_apk/Sensei.apk
          ls -la release_apk/
          echo "APK successfully built at release_apk/Sensei.apk"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Sensei-APK
          path: release_apk/Sensei.apk
          retention-days: 30

      - name: Publish Direct APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.event_name == 'workflow_dispatch'
        with:
          tag_name: latest
          name: "Sensei Canlı APK v1.0.0"
          body: "🐊 Sensei BingeLingo Android Uygulaması. Doğrudan telefonunuza kurabilirsiniz!"
          draft: false
          prerelease: false
          files: release_apk/Sensei.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
