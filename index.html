    <script>
      // Safe Storage fallback for cross-origin iframes
      try {
        var _test = '__t_' + Date.now();
        window.localStorage.setItem(_test, _test);
        window.localStorage.removeItem(_test);
      } catch (e) {
        console.warn('Storage restricted in iframe, using memory storage fallback');
        var _store = {};
        var _fakeStorage = {
          getItem: function(k) { return Object.prototype.hasOwnProperty.call(_store, k) ? _store[k] : null; },
          setItem: function(k, v) { _store[k] = String(v); },
          removeItem: function(k) { delete _store[k]; },
          clear: function() { _store = {}; }
        };
        try {
          Object.defineProperty(window, 'localStorage', { value: _fakeStorage, writable: true, configurable: true });
          Object.defineProperty(window, 'sessionStorage', { value: _fakeStorage, writable: true, configurable: true });
        } catch (e2) {}
      }

      // AI Studio preview iframe environment: suppress benign Vite HMR WebSocket notice
      (function() {
        var origError = console.error;
        console.error = function() {
          var args = Array.prototype.slice.call(arguments);
          if (args.length > 0) {
            var msg = String(args[0] && args[0].message ? args[0].message : args[0]);
            if (msg.indexOf('WebSocket closed without opened') !== -1) {
              return; // Benign Vite HMR WebSocket notice ignored in preview environment
            }
          }
          return origError.apply(console, arguments);
        };
      })();
